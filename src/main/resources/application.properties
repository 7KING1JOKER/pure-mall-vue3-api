spring.application.name=pure-mall-backend

# 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/pure_mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 数据库密码通过环境变量 DB_PASSWORD 注入；本地开发请在 application-local.properties 中配置（该文件已被 .gitignore 忽略）
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus配置
mybatis-plus.configuration.map-underscore-to-camel-case=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.puremall.entity

# JWT配置
# 双 Token 架构（亮点3）：access token 短时效，过期触发前端无感刷新；refresh token 长时效，用于续期
# JWT 密钥通过环境变量 JWT_SECRET 注入；本地开发请在 application-local.properties 中配置（该文件已被 .gitignore 忽略）
jwt.secret=${JWT_SECRET}
# access token 有效期：1 小时（3600000ms），过期后由前端用 refreshToken 静默换新
jwt.expiration=3600000
# refresh token 有效期：7 天（604800000ms），过期则强制登出
jwt.refresh-expiration=604800000

# 激活本地配置覆盖文件（application-local.properties 存放真实密钥，已被 .gitignore 忽略）
# 生产环境请通过环境变量 DB_PASSWORD / JWT_SECRET 注入，并用 SPRING_PROFILES_ACTIVE 覆盖此配置
spring.profiles.active=local
